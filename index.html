<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🚀 Vượt Chướng Ngại Vật</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0b0e1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .game-wrapper {
      background: linear-gradient(145deg, #141829, #1a1f2f);
      border-radius: 32px;
      padding: 24px 24px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
    }

    .game-container {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      width: 600px;
      height: 700px;
      background: #0f1322;
      touch-action: none;
    }

    /* ===== HUD ===== */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 0 18px;
      color: #c8d0e6;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .hud-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-item .icon {
      font-size: 20px;
    }
    .hud-item .label {
      font-size: 13px;
      opacity: 0.6;
      font-weight: 400;
    }
    .hud-item .value {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f0f4ff, #a0b4e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      min-width: 40px;
      text-align: center;
    }
    .hud-item .value.high {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== OVERLAY ===== */
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      animation: fadeIn 0.5s ease;
      z-index: 10;
      background: rgba(8, 10, 22, 0.85);
      backdrop-filter: blur(10px);
    }

    .overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== MENU ===== */
    #startMenu .game-title {
      font-size: 56px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd700, #ff6b6b, #4a6cf7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #startMenu .game-subtitle {
      color: #8a94b8;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 6px;
      margin-bottom: 24px;
    }

    #startMenu .menu-hint {
      color: #7a84a8;
      font-size: 15px;
      margin-top: 22px;
      letter-spacing: 1px;
      font-weight: 400;
      background: rgba(255,255,255,0.04);
      padding: 10px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
    }

    /* ===== SKIN PICKER ===== */
    .skin-picker {
      display: flex;
      gap: 14px;
      margin: 16px 0 8px 0;
      padding: 8px 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .skin-picker .skin-label {
      color: #8a94b8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
      margin-right: 6px;
      display: flex;
      align-items: center;
    }

    .skin-option {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: relative;
    }

    .skin-option:hover {
      transform: scale(1.12);
      border-color: rgba(255,255,255,0.6);
    }

    .skin-option.active {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      transform: scale(1.08);
    }

    .skin-option:active {
      transform: scale(0.92);
    }

    /* ===== GAME OVER ===== */
    #gameOverOverlay .game-over-title {
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #ee2d2d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(255, 50, 50, 0.25);
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    #gameOverOverlay .game-over-sub {
      color: #7a84a8;
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 22px;
      letter-spacing: 4px;
    }

    #gameOverOverlay .game-over-score {
      color: #e8eeff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    #gameOverOverlay .game-over-score span {
      background: linear-gradient(135deg, #f0f4ff, #80a0e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 44px;
    }

    #gameOverOverlay .game-over-high {
      color: #8a94b8;
      font-size: 18px;
      margin-bottom: 32px;
    }
    #gameOverOverlay .game-over-high span {
      color: #ffd700;
      font-weight: 700;
    }

    .btn-primary, .btn-restart {
      background: linear-gradient(135deg, #4a6cf7, #6a3de8);
      border: none;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 16px 52px;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 30px rgba(74, 108, 247, 0.35);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-primary:hover, .btn-restart:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px rgba(74, 108, 247, 0.5);
    }
    .btn-primary:active, .btn-restart:active {
      transform: scale(0.96);
    }

    .btn-restart {
      font-size: 20px;
      padding: 14px 46px;
    }

    /* ===== HƯỚNG DẪN DƯỚI ===== */
    .controls-hint {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding-top: 14px;
      color: #4a5478;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .controls-hint kbd {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8a94b8;
      font-size: 12px;
    }

    .controls-hint .sep {
      opacity: 0.2;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 660px) {
      .game-wrapper {
        padding: 12px;
        border-radius: 20px;
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 600 / 700;
      }
      .hud {
        font-size: 14px;
        padding: 10px 10px 0 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hud-item {
        padding: 4px 12px;
        font-size: 13px;
      }
      .hud-item .value {
        font-size: 16px;
        min-width: 28px;
      }
      #startMenu .game-title {
        font-size: 34px;
      }
      #startMenu .game-subtitle {
        font-size: 14px;
        letter-spacing: 4px;
      }
      .btn-primary {
        font-size: 18px;
        padding: 14px 40px;
      }
      .btn-restart {
        font-size: 16px;
        padding: 12px 34px;
      }
      #gameOverOverlay .game-over-title {
        font-size: 34px;
      }
      #gameOverOverlay .game-over-score {
        font-size: 20px;
      }
      #gameOverOverlay .game-over-score span {
        font-size: 32px;
      }
      .controls-hint {
        font-size: 11px;
        gap: 14px;
        flex-wrap: wrap;
      }
      #startMenu .menu-hint {
        font-size: 13px;
        padding: 8px 18px;
      }
      .skin-picker {
        gap: 10px;
        padding: 6px 14px;
      }
      .skin-option {
        width: 30px;
        height: 30px;
      }
    }

    @media (max-width: 400px) {
      .game-wrapper {
        padding: 6px;
        border-radius: 14px;
      }
      .hud-item .label {
        display: none;
      }
      #startMenu .game-title {
        font-size: 26px;
      }
      .skin-option {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- HUD -->
    <div class="hud">
      <div class="hud-left">
        <div class="hud-item">
          <span class="icon">⭐</span>
          <span class="label">Điểm</span>
          <span class="value" id="scoreDisplay">0</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-item">
          <span class="icon">🏆</span>
          <span class="label">Cao nhất</span>
          <span class="value high" id="highScoreDisplay">0</span>
        </div>
      </div>
    </div>

    <div class="game-container">
      <canvas id="gameCanvas" width="600" height="700"></canvas>

      <!-- MENU START -->
      <div class="overlay active" id="startMenu">
        <div class="game-title">🚀 VƯỢT CHƯỚNG</div>
        <div class="game-subtitle">• NGẠI VẬT •</div>

        <!-- Skin Picker -->
        <div class="skin-picker">
          <span class="skin-label">🎨 Skin</span>
          <div class="skin-option active" style="background: #3a7bd5;" data-color="#3a7bd5"></div>
          <div class="skin-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
          <div class="skin-option" style="background: #2ecc71;" data-color="#2ecc71"></div>
          <div class="skin-option" style="background: #f39c12;" data-color="#f39c12"></div>
          <div class="skin-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
          <div class="skin-option" style="background: #1abc9c;" data-color="#1abc9c"></div>
          <div class="skin-option" style="background: #e67e22;" data-color="#e67e22"></div>
          <div class="skin-option" style="background: #e84393;" data-color="#e84393"></div>
        </div>

        <button class="btn-primary" id="playBtn">▶ BẮT ĐẦU</button>
        <div class="menu-hint">
          ← ↑ → ↓  ·  A W S D  ·  Chuột / Chạm
        </div>
      </div>

      <!-- GAME OVER -->
      <div class="overlay" id="gameOverOverlay">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-sub">• thử lại nào •</div>
        <div class="game-over-score">
          Điểm của bạn &nbsp; <span id="finalScore">0</span>
        </div>
        <div class="game-over-high">
          🏆 Kỷ lục &nbsp; <span id="finalHighScore">0</span>
        </div>
        <button class="btn-restart" id="restartBtn">🔄 CHƠI LẠI</button>
      </div>
    </div>

    <div class="controls-hint">
      <span><kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>A</kbd> <kbd>D</kbd></span>
      <span class="sep">•</span>
      <span>🖱️ di chuột</span>
      <span class="sep">•</span>
      <span>📱 chạm kéo</span>
    </div>
  </div>

  <script>
    // ============================================================
    //  GAME  –  VƯỢT CHƯỚNG NGẠI VẬT  (có Skin)
    // ============================================================

    // -------- DOM refs --------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const finalScore = document.getElementById('finalScore');
    const finalHighScore = document.getElementById('finalHighScore');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startMenu = document.getElementById('startMenu');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const skinOptions = document.querySelectorAll('.skin-option');

    const W = 600,
      H = 700;

    // -------- Cài đặt --------
    const PLAYER_SIZE = 28;
    const PLAYER_SPEED = 5.5;
    const BASE_OBSTACLE_SPEED = 3.2;
    const MAX_OBSTACLE_SPEED = 9;
    const SPAWN_BASE = 26;
    const SPAWN_MIN = 10;

    // -------- Trạng thái --------
    let player = { x: W / 2, y: H - 100, size: PLAYER_SIZE };
    let obstacles = [];
    let particles = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('obstacleGameHigh')) || 0;
    let gameRunning = false;
    let frameCount = 0;
    let spawnCounter = 0;
    let difficulty = 1;
    let keys = { left: false, right: false, up: false, down: false };

    let useMouseControl = false;
    let mouseX = player.x;

    // -------- Skin --------
    let playerColor = localStorage.getItem('playerSkin') || '#3a7bd5';

    // -------- High score --------
    highScoreDisplay.textContent = highScore;

    // -------- Spawn --------
    function spawnObstacle() {
      const size = 18 + Math.random() * 30;
      const x = 20 + Math.random() * (W - size - 40);
      const speed = Math.min(BASE_OBSTACLE_SPEED + difficulty * 0.35, MAX_OBSTACLE_SPEED);
      const hue = (Math.random() * 60 + 340) % 360;
      const sat = 70 + Math.random() * 30;
      const lig = 50 + Math.random() * 30;
      const color = `hsl(${hue}, ${sat}%, ${lig}%)`;
      const shape = Math.floor(Math.random() * 3);
      obstacles.push({
        x,
        y: -size,
        size,
        speed,
        color,
        shape,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.04,
      });
    }

    // -------- Particle --------
    function emitParticles(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          life: 1,
          decay: 0.012 + Math.random() * 0.025,
          size: 3 + Math.random() * 6,
          color: color,
        });
      }
    }

    // -------- Reset game --------
    function resetGame() {
      player.x = W / 2;
      player.y = H - 100;
      obstacles = [];
      particles = [];
      score = 0;
      frameCount = 0;
      spawnCounter = 0;
      difficulty = 1;
      gameRunning = true;
      gameOverOverlay.classList.remove('active');
      startMenu.classList.remove('active');
      scoreDisplay.textContent = '0';
      useMouseControl = false;
      mouseX = player.x;
      keys = { left: false, right: false, up: false, down: false };
    }

    // -------- Game Over --------
    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('obstacleGameHigh', String(highScore));
        highScoreDisplay.textContent = highScore;
      }
      finalScore.textContent = score;
      finalHighScore.textContent = highScore;
      gameOverOverlay.classList.add('active');
    }

    // -------- Cập nhật --------
    function update() {
      if (!gameRunning) return;
      frameCount++;

      difficulty = 1 + Math.floor(score / 120) * 0.6;
      const spawnRate = Math.max(SPAWN_MIN, SPAWN_BASE - difficulty * 1.2);

      spawnCounter++;
      if (spawnCounter >= spawnRate) {
        spawnCounter = 0;
        const count = Math.random() < 0.2 + difficulty * 0.03 ? 2 : 1;
        for (let i = 0; i < count; i++) spawnObstacle();
      }

      let dx = 0,
        dy = 0;
      if (keys.left) dx = -PLAYER_SPEED;
      if (keys.right) dx = PLAYER_SPEED;
      if (keys.up) dy = -PLAYER_SPEED;
      if (keys.down) dy = PLAYER_SPEED;

      if (useMouseControl) {
        const diff = mouseX - player.x;
        if (Math.abs(diff) > 2) {
          dx = Math.sign(diff) * Math.min(PLAYER_SPEED, Math.abs(diff) * 0.18);
        }
      }

      if (!keys.left && !keys.right && useMouseControl) {
        const diff = mouseX - player.x;
        if (Math.abs(diff) > 2) {
          dx = Math.sign(diff) * Math.min(PLAYER_SPEED, Math.abs(diff) * 0.18);
        }
      }

      player.x += dx;
      player.y += dy;
      const half = player.size / 2;
      player.x = Math.max(half, Math.min(W - half, player.x));
      player.y = Math.max(half + 20, Math.min(H - half - 10, player.y));

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.y += o.speed;
        o.rotation += o.rotSpeed;

        const dist = Math.hypot(o.x - player.x, o.y - player.y);
        const threshold = (o.size + player.size) / 2 * 0.8;
        if (dist < threshold) {
          emitParticles(player.x, player.y, '#ff6b6b', 30);
          emitParticles(o.x, o.y, o.color, 20);
          gameOver();
          return;
        }

        if (o.y > H + 60) {
          obstacles.splice(i, 1);
          if (gameRunning) {
            score += Math.floor(1 + difficulty * 0.5);
            scoreDisplay.textContent = score;
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      if (obstacles.length > 80) {
        obstacles.splice(0, obstacles.length - 80);
      }
    }

    // -------- Vẽ --------
    function draw() {
      ctx.clearRect(0, 0, W, H);

      const grad = ctx.createRadialGradient(300, 350, 100, 300, 350, 500);
      grad.addColorStop(0, '#19203a');
      grad.addColorStop(1, '#0a0d18');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(255,255,255,0.02)';
      ctx.lineWidth = 1;
      for (let i = 0; i < W; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, H);
        ctx.stroke();
      }
      for (let i = 0; i < H; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(W, i);
        ctx.stroke();
      }

      for (const o of obstacles) {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rotation);
        const s = o.size;
        const half = s / 2;
        ctx.shadowColor = o.color + '60';
        ctx.shadowBlur = 20;
        ctx.fillStyle = o.color;

        if (o.shape === 0) {
          ctx.beginPath();
          ctx.arc(0, 0, half, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.15)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (o.shape === 1) {
          ctx.fillRect(-half, -half, s, s);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-half, -half, s, s);
        } else {
          ctx.beginPath();
          ctx.moveTo(0, -half);
          ctx.lineTo(-half, half);
          ctx.lineTo(half, half);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = '#fff';
        if (o.shape === 0) {
          ctx.beginPath();
          ctx.arc(-half * 0.25, -half * 0.25, half * 0.3, 0, Math.PI * 2);
          ctx.fill();
        } else if (o.shape === 1) {
          ctx.fillRect(-half * 0.3, -half * 0.3, half * 0.35, half * 0.35);
        } else {
          ctx.beginPath();
          ctx.arc(-half * 0.2, -half * 0.3, half * 0.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      for (const p of particles) {
        ctx.globalAlpha = p.life * 0.9;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life * 0.8 + 1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // ---- Vẽ người chơi với màu skin ----
      const px = player.x,
        py = player.y,
        ps = player.size;
      const glow = ctx.createRadialGradient(px, py, 2, px, py, ps * 1.4);
      glow.addColorStop(0, playerColor + '40');
      glow.addColorStop(1, playerColor + '00');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, ps * 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = playerColor;
      ctx.shadowBlur = 30;
      const gradP = ctx.createRadialGradient(px - 4, py - 4, 2, px, py, ps);
      // Làm sáng màu skin cho hiệu ứng
      const brightColor = lightenColor(playerColor, 40);
      const darkColor = darkenColor(playerColor, 30);
      gradP.addColorStop(0, brightColor);
      gradP.addColorStop(0.7, playerColor);
      gradP.addColorStop(1, darkColor);
      ctx.fillStyle = gradP;
      ctx.beginPath();
      ctx.arc(px, py, ps / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, ps / 2, 0, Math.PI * 2);
      ctx.stroke();

      // Mắt (giữ nguyên)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(px - 5, py - 4, 4.5, 0, Math.PI * 2);
      ctx.arc(px + 5, py - 4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a2a4a';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(px - 6, py - 2, 2.2, 0, Math.PI * 2);
      ctx.arc(px + 4, py - 2, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(px - 7, py - 5, 1.2, 0, Math.PI * 2);
      ctx.arc(px + 3, py - 5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#1a2a4a';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(px, py + 2, 6, 0.1, Math.PI - 0.1);
      ctx.stroke();

      if (obstacles.length > 25 && gameRunning) {
        ctx.fillStyle = `rgba(255, 100, 100, ${0.06 + Math.sin(Date.now() / 300) * 0.03})`;
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('⚡ Tăng tốc!', W / 2, 16);
      }
    }

    // -------- Helper: làm sáng / tối màu --------
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
      return {
        r: parseInt(c.substring(0,2), 16),
        g: parseInt(c.substring(2,4), 16),
        b: parseInt(c.substring(4,6), 16)
      };
    }
    function rgbToHex(r,g,b) {
      return '#' + [r,g,b].map(c => Math.min(255, Math.max(0, Math.round(c))).toString(16).padStart(2,'0')).join('');
    }
    function lightenColor(hex, amt) {
      const {r,g,b} = hexToRgb(hex);
      return rgbToHex(r+amt, g+amt, b+amt);
    }
    function darkenColor(hex, amt) {
      const {r,g,b} = hexToRgb(hex);
      return rgbToHex(r-amt, g-amt, b-amt);
    }

    // -------- Vòng lặp --------
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // -------- Điều khiển --------
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = true;
        e.preventDefault();
        useMouseControl = false; }
      if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = true;
        e.preventDefault();
        useMouseControl = false; }
      if (key === 'ArrowUp' || key === 'w' || key === 'W') { keys.up = true;
        e.preventDefault();
        useMouseControl = false; }
      if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = true;
        e.preventDefault();
        useMouseControl = false; }
      if (key === 'r' || key === 'R') {
        if (!gameRunning && gameOverOverlay.classList.contains('active')) {
          resetGame();
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = false;
        e.preventDefault(); }
      if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = false;
        e.preventDefault(); }
      if (key === 'ArrowUp' || key === 'w' || key === 'W') { keys.up = false;
        e.preventDefault(); }
      if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = false;
        e.preventDefault(); }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseCanvasX = (e.clientX - rect.left) * scaleX;
      mouseX = Math.max(0, Math.min(W, mouseCanvasX));
      useMouseControl = true;
    });

    let touchId = null;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      if (!touch) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const tx = (touch.clientX - rect.left) * scaleX;
      const ty = (touch.clientY - rect.top) * scaleY;
      mouseX = Math.max(0, Math.min(W, tx));
      player.y = Math.max(player.size / 2 + 20, Math.min(H - player.size / 2 - 10, ty));
      useMouseControl = true;
      touchId = touch.identifier;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        if (touchId !== null && touch.identifier !== touchId) continue;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const tx = (touch.clientX - rect.left) * scaleX;
        const ty = (touch.clientY - rect.top) * scaleY;
        mouseX = Math.max(0, Math.min(W, tx));
        player.y = Math.max(player.size / 2 + 20, Math.min(H - player.size / 2 - 10, ty));
        useMouseControl = true;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      touchId = null;
    }, { passive: false });
    canvas.addEventListener('touchcancel', () => { touchId = null; });

    // -------- Skin Picker --------
    function setSkin(color) {
      playerColor = color;
      localStorage.setItem('playerSkin', color);
      skinOptions.forEach(el => el.classList.remove('active'));
      document.querySelector(`.skin-option[data-color="${color}"]`)?.classList.add('active');
    }

    skinOptions.forEach(opt => {
      opt.addEventListener('click', (e) => {
        const color = opt.dataset.color;
        setSkin(color);
      });
      opt.addEventListener('touchend', (e) => {
        e.preventDefault();
        const color = opt.dataset.color;
        setSkin(color);
      });
    });

    // Khôi phục skin đã chọn
    (function initSkin() {
      const saved = localStorage.getItem('playerSkin');
      if (saved) {
        const el = document.querySelector(`.skin-option[data-color="${saved}"]`);
        if (el) {
          el.classList.add('active');
          playerColor = saved;
        } else {
          document.querySelector('.skin-option')?.classList.add('active');
        }
      } else {
        document.querySelector('.skin-option')?.classList.add('active');
      }
    })();

    // -------- Nút --------
    playBtn.addEventListener('click', resetGame);
    playBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      resetGame();
    });

    restartBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      resetGame();
    });

    // -------- Khởi động --------
    startMenu.classList.add('active');
    gameRunning = false;
    loop();

    // -------- Resize --------
    function resizeCanvas() {
      const wrapper = canvas.parentElement;
      const maxW = wrapper.clientWidth;
      if (maxW < 600) {
        canvas.style.width = maxW + 'px';
        canvas.style.height = (maxW * 700 / 600) + 'px';
      } else {
        canvas.style.width = '600px';
        canvas.style.height = '700px';
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    console.log('🎮 Game Vượt Chướng Ngại Vật – có đổi Skin');
  </script>
</body>
</html>
